# Builds the page as static files and deploys it to Cloudflare Pages.
# Secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID.
name: build

on:
  schedule:
    # Hourly: a private repository has 2000 free Actions minutes a month.
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Berlin
      # A step cannot read a secret in its condition, so the job copies it.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s test -p 'test_*.py'
      # The counts of the last build, so observe() can mark a gain.
      - uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python app.py build dist
      - uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
      # With no token, the run builds and skips the deploy.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wire --branch=main
